name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: [
      self-hosted,
      linux,
      x64
    ]
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make

      - name: Configure
        shell: msys2 {0}
        run: cmake -G "MinGW Makefiles" -B build

      - name: Build
        shell: msys2 {0}
        run: cmake --build build